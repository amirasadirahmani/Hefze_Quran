name: Android development build
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Android SDK packages
        run: |
          sdkmanager_bin=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -1)
          test -n "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses > /dev/null
          "$sdkmanager_bin" 'platforms;android-35' 'build-tools;35.0.0'
      - run: bash tools/test_core.sh
      - run: python3 tools/validate_assets.py
      - run: python3 tools/verify_full_quran.py
      - run: python3 -m unittest discover -s tests -v
      - name: Verify reproducible Quran layout
        run: |
          python3 -m pip install -r tools/requirements-content.txt
          python3 tools/check_generated_content.py
          python3 tools/check_layout.py
      - name: Build and lint APK
        run: |
          bash gradlew --no-daemon :app:assembleDebug :app:lintDebug || {
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
            exit 1
          }
      - name: Check lightweight APK contents
        run: python3 tools/check_apk.py
      - name: Record build source
        run: |
          printf 'Version: 0.7.0\nPackage: ir.hefze.quran.review07\nCommit: %s\nBranch: %s\nRun: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > BUILD_INFO.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk >> BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hefze-quran-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            BUILD_INFO.txt
