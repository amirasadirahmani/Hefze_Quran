<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>پیش‌نمایش طراحی حفظ قرآن</title>
<style>
@font-face{font-family:Quran;src:url('../app/src/main/assets/fonts/ScheherazadeNew-Regular.ttf')}
*{box-sizing:border-box}body{margin:0;background:#e7eadc;color:#263521;font-family:Tahoma,Arial,sans-serif}.note{max-width:1000px;margin:22px auto;text-align:center;font-size:14px}.screens{display:flex;gap:28px;justify-content:center;padding:0 24px 24px}.screen{width:400px;height:844px;position:relative;flex:none;overflow:hidden;background:#faf8eb;box-shadow:0 10px 40px #31442122;display:flex;flex-direction:column}.art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}header,main,footer{position:relative}header{padding:22px 30px 20px}h1{font-family:Quran;font-size:30px;font-weight:400;line-height:1.2;margin:0}button{font-family:inherit;cursor:pointer;border:0;border-radius:4px;background:#e8efd6;color:#526c39;min-height:40px;padding:8px 10px;font-size:12px}.primary{background:#607b43;color:white}button:disabled{opacity:.6}.row{display:flex;align-items:center;gap:5px}.row>*{flex:1;text-align:center}.basmala{font:25px Quran;text-align:center;white-space:nowrap;margin-top:5px;line-height:1.5}.basmala small{font:12px Tahoma;margin-right:9px}.reader-main{flex:1;overflow:auto;padding:0 15px}.quran{width:100%;direction:rtl}.line{font:23.16px Quran;height:50.53px;line-height:50.53px;white-space:nowrap;text-align:right;display:flex;align-items:center;justify-content:space-between;padding:0 15px}.word{display:inline-block;white-space:pre}.selected{background:#edf2dc}.medallion{display:inline-flex;border:1px solid #70884d;outline:1px solid #a6b987;outline-offset:2px;border-radius:50%;width:18px;height:25px;align-items:center;justify-content:center;font:14px Quran;color:#607b43;flex:none;margin:0 4px}.reader-footer{padding:20px 30px 28px}.position{font-size:11px;text-align:center;line-height:22px}.status{font-size:11px;text-align:center;line-height:25px}.track{height:3px;background:#dce5c8;margin-bottom:8px}.transport{margin-bottom:6px}.transport button{height:44px}.catalog-header h1{text-align:center;margin-bottom:8px}.catalog-body{display:flex;flex:1;min-height:0;padding:0 24px;gap:6px}.surahs{flex:1;min-width:0;display:flex;flex-direction:column}.search{height:43px;border:1px solid #c2d29d;background:#fffdf3;font:13px Tahoma;padding:10px;width:100%;color:#354a28;outline-color:#607b43}.surah-list{overflow:auto;flex:1}.entry{border-bottom:1px solid #d1ddba;padding:8px 9px;cursor:pointer}.entry strong{font:25px Quran;display:block;font-weight:400;line-height:1.6}.entry small{font-size:10px;display:block;color:#68765b;line-height:20px}.entry.available{background:#e5edce}.juz{width:64px;overflow:auto}.juz button{display:block;width:100%;margin-bottom:4px;height:43px;flex:none}.juz button.current{background:#cbdba8}.catalog-footer{padding:21px 30px 28px;text-align:center}.catalog-footer p{font-size:12px;margin:0 0 8px}.catalog-footer button{width:100%;height:44px}.empty{font-size:13px;padding:20px 5px}.screens.single .screen{display:none}.screens.single .screen.show{display:flex}@media(max-width:870px){.screens{flex-wrap:wrap}.note{padding:0 20px}} ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#b9c99b}
.reader-header,.catalog-header{height:100px;flex:none;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:17px 35px 9px}
.reader-header{padding:10px 35px 22px}
.catalog-header{padding:10px 35px 20px}
.reader-header .basmala{font:22px/1.45 Quran;margin:0;white-space:nowrap}
.reader-header #page-num{font-size:12px;line-height:17px}
.reader-nav{position:relative;flex:none;padding:0 30px;height:50px;gap:5px}
.reader-nav button{min-height:42px}
.catalog-header h1{margin:0;line-height:1.4}
.reader-footer{padding:8px 30px 31px}
.reader-footer .transport{padding:0 22px;margin-top:4px}
.reader-footer .ghost{background:transparent}
.catalog-footer button{width:225px;max-width:100%}
</style>
<p class="note">پیش‌نمایش طراحی با متن و فونت واقعی پروژه — تصویر اجرای اندروید نیست</p>
<div class="screens">
<section class="screen" id="reader"><canvas class="art"></canvas>
<header class="reader-header"><div class="basmala" id="header-title"></div><div id="page-num"></div></header><nav class="row reader-nav"><button onclick="show('catalog')">فهرست</button><button>بیشتر</button></nav>
<main class="reader-main"><div class="quran" id="quran"></div></main>
<footer class="reader-footer"><div class="row"><button onclick="movePage(-1)">صفحهٔ قبل</button><button onclick="toggleText()">آزمون حفظ</button><button onclick="movePage(1)">صفحهٔ بعد</button></div><div class="position" id="position">آیهٔ ۱ • تکرار ۱ از ۳ • محدودهٔ ۱ تا ۸۳</div><div class="status">برای شنیدن این آیه، صوت آن را دریافت کنید.</div><div class="track"></div><div class="row transport"><button class="ghost" aria-label="آیهٔ قبل">قبل</button><button class="primary">دریافت صوت</button><button class="ghost" aria-label="آیهٔ بعد">بعد</button></div></footer></section>
<section class="screen" id="catalog"><canvas class="art"></canvas>
<header class="catalog-header"><h1>قرآن کریم</h1></header><nav class="row reader-nav"><button>درباره</button><button>پیشرفت</button><button>تنظیمات</button></nav>
<main class="catalog-body"><div class="surahs"><input class="search" placeholder="جستجوی نام یا شمارهٔ سوره" aria-label="جستجوی سوره"><div class="surah-list"></div></div><div class="juz"></div></main><footer class="catalog-footer"><p>بستهٔ فعال: یاسین • ۸۳ آیه</p><button class="primary" onclick="show('reader')">ادامهٔ مطالعهٔ یاسین</button></footer></section></div>
<script>
let content,catalog,currentPage=0,juz=0,art=new Image();const fa=v=>String(v).replace(/\d/g,c=>'۰۱۲۳۴۵۶۷۸۹'[+c]);
const normalize=s=>s.normalize('NFD').replace(/\p{M}/gu,'').replace(/ـ/g,'').replace(/ی/g,'ي').replace(/ک/g,'ك').replace(/ٱ/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c));
function show(id){if(innerWidth<870){document.querySelector('.screens').classList.add('single');document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('show',s.id===id));drawArt()}}
function renderPage(){document.querySelector('#quran').innerHTML=content.pages[currentPage].lines.map(line=>'<div class="line">'+line.map(t=>t.word<0?`<span class="medallion">${fa(t.ayah)}</span>`:`<span class="word ${t.ayah===1?'selected':''}">${t.text}</span>`).join('')+'</div>').join('');document.querySelector('#header-title').textContent=currentPage===0?content.basmala:'سورة يس';document.querySelector('#page-num').textContent='صفحهٔ '+fa(currentPage+1)+' از '+fa(content.pages.length);document.querySelector('.reader-main').scrollTop=0}
function movePage(d){currentPage=Math.max(0,Math.min(content.pages.length-1,currentPage+d));renderPage()}
function toggleText(){document.querySelector('#quran').style.visibility=document.querySelector('#quran').style.visibility==='hidden'?'visible':'hidden'}
function renderList(){const q=normalize(document.querySelector('.search').value.trim());const rows=catalog.surahs.filter(s=>(juz===0||s.firstJuz<=juz&&s.lastJuz>=juz)&&(!q||normalize(s.name).includes(q)||(s.number===36&&normalize('یاسین').includes(q))||String(s.number)===q));document.querySelector('.surah-list').innerHTML=rows.map(s=>`<div class="entry ${s.available?'available':''}" data-number="${s.number}"><strong>${s.name}</strong><small>${fa(s.number)} • ${fa(s.ayahs)} آیه • ${s.available?'آمادهٔ مطالعه':'هنوز افزوده نشده'}</small></div>`).join('')||'<div class="empty">سوره‌ای با این نام پیدا نشد.</div>';document.querySelectorAll('.entry.available').forEach(e=>e.onclick=()=>show('reader'))}
function drawArt(){if(!art.complete)return;document.querySelectorAll('.screen').forEach(s=>{const c=s.querySelector('canvas'),w=s.clientWidth,h=s.clientHeight;if(!w||!h)return;c.width=w*2;c.height=h*2;const ctx=c.getContext('2d');ctx.scale(2,2);const top=s.querySelector('header').offsetHeight,bottom=s.querySelector('footer').offsetHeight,scale=w/art.width,topCap=Math.min(60*scale,top*.4),topTail=Math.min(50*scale,top*.35),ornament=Math.min(bottom,159*scale);const part=(from,to,y,height)=>ctx.drawImage(art,0,from,art.width,to-from,0,y,w,height);part(0,60,0,topCap);part(60,90,topCap,top-topCap-topTail);part(90,140,top-topTail,topTail);part(140,865,top,h-top-ornament);part(865,1024,h-ornament,ornament)})}
Promise.all([fetch('../app/src/main/assets/content/yasin.json').then(r=>r.json()),fetch('../app/src/main/assets/content/surahs.json').then(r=>r.json()),document.fonts.ready]).then(([a,b])=>{content=a;catalog=b;renderPage();renderList();document.querySelector('.search').oninput=renderList;document.querySelector('.juz').innerHTML=Array.from({length:31},(_,n)=>`<button data-juz="${n}" class="${n===0?'current':''}">${n===0?'همه':'جزء '+fa(n)}</button>`).join('');document.querySelectorAll('[data-juz]').forEach(b=>b.onclick=()=>{juz=+b.dataset.juz;document.querySelectorAll('[data-juz]').forEach(x=>x.classList.toggle('current',x===b));renderList()});document.fonts.ready.then(drawArt);window.ready=true});
art.onload=drawArt;art.src='../app/src/main/res/drawable-nodpi/mushaf_pistachio.jpg';addEventListener('resize',drawArt);
</script></html>
