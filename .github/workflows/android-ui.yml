name: Android UI checks
on:
  push:
    branches: [main, 'review/**']
    paths: ['app/**', 'gradle.properties', '.github/workflows/android-ui.yml', 'tools/run_device_tests.sh']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: bash tools/run_device_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/ui-shots
